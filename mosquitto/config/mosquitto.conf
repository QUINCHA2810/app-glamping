# Configuración mínima para DESARROLLO LOCAL únicamente.
# allow_anonymous true = cualquiera en tu red local puede publicar/suscribirse
# sin usuario ni contraseña. Es aceptable ahora porque Mosquitto solo escucha
# en tu propio computador (localhost) — pero si algún día este broker se
# expone fuera de tu red local o a internet, hay que agregar autenticación
# (usuario/contraseña o certificados) antes de eso. No es parte del alcance
# actual, solo queda anotado aquí para cuando llegue ese momento.
 
listener 1883
allow_anonymous true
 
listener 9001
protocol websockets
 
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log