# Línea de migraciones del modelo v2 (docs/modelo_v2/MAPEO.md). Independiente de
# alembic.ini: otra carpeta, otra base y otra variable de entorno.
#
#   alembic -c alembic_v2.ini upgrade head
#
# La URL sale SOLO de DATABASE_URL_V2 (backend/.env o el entorno), nunca de aquí ni de
# DATABASE_URL: ver alembic_v2/env.py.

[alembic]
script_location = %(here)s/alembic_v2
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
